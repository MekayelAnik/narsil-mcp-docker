services:
  narsil-mcp:
    image: mekayelanik/narsil-mcp:latest
    container_name: narsil-mcp
    environment:
      - PORT=8010
      - INTERNAL_PORT=38011
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - NODE_ENV=production
      - PROTOCOL=SHTTP
      - ENABLE_HTTPS=false
      - HTTP_VERSION_MODE=auto
      - DATA_DIR=/data
      # mcp-proxy session model. Stateful by default — one stdio child per
      # Mcp-Session-Id, reused across requests. Sessions persist until the
      # client explicitly closes them (no server-side TTL). Set to "true"
      # only if full per-request isolation is required (memory-hostile,
      # breaks the index-ready gate).
      - MCP_PROXY_STATELESS=false
      # Cap virtual memory of each narsil stdio child (MiB; 0 disables)
      - NARSIL_MAX_MEM_MB=4096
      # HAProxy concurrency caps (0 disables)
      - HAPROXY_FRONTEND_MAXCONN=64
      - HAPROXY_SERVER_MAXCONN=16
      # Narsil MCP feature flags
      - NARSIL_GIT=true
      - NARSIL_CALL_GRAPH=true
      - NARSIL_PERSIST=true
      - NARSIL_WATCH=false
      - NARSIL_STREAMING=true
      - NARSIL_VERBOSE=false
      # - NARSIL_NEURAL=true
      # - NARSIL_NEURAL_BACKEND=api
      # - NARSIL_NEURAL_MODEL=voyage-code-2
      # - NARSIL_GRAPH=true
      # - NARSIL_LSP=true
      # - NARSIL_REMOTE=true
      # - NARSIL_PRESET=full
      # Neural embedding API keys (uncomment as needed)
      # - EMBEDDING_API_KEY=your-api-key
      # - VOYAGE_API_KEY=your-voyage-key
      # - OPENAI_API_KEY=your-openai-key
      # - EMBEDDING_SERVER_ENDPOINT=http://custom-endpoint
      # Optional: require Bearer token auth at HAProxy layer
      # - API_KEY=replace-with-strong-secret
      # Optional: CORS origins (comma-separated, or * for all)
      # - CORS=*
    ports:
      - "8010:8010"
    volumes:
      # Mount your repository directories for code analysis
      # Each subdirectory becomes an indexable repository
      - /path/to/your/repos:/data:ro
      # Example: mount individual repos
      # - /home/user/my-rust-project:/data/my-rust-project:ro
      # - /home/user/another-repo:/data/another-repo:ro
      # Persistent cache for HuggingFace models, ONNX runtime, etc.
      # Prevents re-downloading embedding models on every container restart
      - narsil-cache:/home/narsil/.cache
    restart: unless-stopped

volumes:
  narsil-cache:
    driver: local
